[project]
name = "clinic-scheduler-agent"
version = "0.1.0"
description = "Clinic appointment-scheduling agent with a self-improving eval harness"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
